# Directories the install makes before the agent first runs (p4-nodes 7.1, 7.2).
# PATH OWNER GROUP MODE. Read by install/apply.sh and by internal/pkgcheck.
#
# internal/store makes the same layout under /var/lib/ctrlz at its first start and
# keeps a setgid bit it finds; the install gives the group-shared directories
# group ctrlz and setgid, so the files and image directories the agent makes later
# inherit the group and `dns` (group ctrlz) can read them.
/etc/ctrlz root root 0755
/etc/ctrlz/versions root root 0755
# The agent writes both Unbound configs here (0640, group of the directory).
/etc/ctrlz/unbound ctrlz-agent ctrlz-unbound-cfg 2750
# The chrony drop-in and its CA copy; chrony reads them as another user, so 0755.
/etc/ctrlz/chrony ctrlz-agent ctrlz-agent 0755
/var/lib/ctrlz ctrlz-agent ctrlz 2750
/var/lib/ctrlz/state ctrlz-agent ctrlz 0700
/var/lib/ctrlz/log ctrlz-agent ctrlz 0700
/var/lib/ctrlz/blobs ctrlz-agent ctrlz 2750
/var/lib/ctrlz/quarantine ctrlz-agent ctrlz 0700
/var/lib/ctrlz/image ctrlz-agent ctrlz 2750
/var/lib/ctrlz/push ctrlz-agent ctrlz 0700
/var/lib/ctrlz/keys ctrlz-agent ctrlz 0700
/var/lib/ctrlz/config ctrlz-agent ctrlz 2750
# Where FetchBundle puts a new node bundle for `ctrlz-node upgrade`; the agent only
# downloads and verifies, and the root-owned upgrade copies before it trusts a byte.
/var/lib/ctrlz/bundles ctrlz-agent ctrlz 0700
