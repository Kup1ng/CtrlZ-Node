# Kernel settings of a node (p4-nodes 7.3, SC 5.2a). The agent cannot write them
# (it has no right to /proc/sys), so the install sets them and the agent checks.

# quic-go wants about 7.5 MB of socket buffer for DoQ and DoH3; the kernel's
# default of 208 KB makes it log a warning and drop packets under load.
net.core.rmem_max = 7500000
net.core.wmem_max = 7500000

# SYN cookies answer a spoofed SYN flood once the host half-open queue is full
# (SC 5.2 step 1, T-017). Ubuntu ships it on, but a distribution default is not a
# guarantee; the agent checks the value and alerts when it is 0.
net.ipv4.tcp_syncookies = 1

# The identified Unbound sends from 41000-41999 and the free one from
# 40000-40999 (SC 5.2a); the notrack rule for the free replies reaches no other
# socket only when the ephemeral range ends below 40000. The agent refuses to
# start the free process otherwise. P4b starts the range at 10240 (p4b-proxy 5.5,
# D31): 29,760 ports to one address and port. The listeners inside it (20000 to
# 20255) are on addresses that nothing dials from.
net.ipv4.ip_local_port_range = 10240 39999

# P4b, p4b-proxy 5.5 (D31). With TCP timestamps at the exit, a port in TIME_WAIT
# serves again after a second.
net.ipv4.tcp_tw_reuse = 1
# At most 2 MiB a socket and direction.
net.ipv4.tcp_rmem = 4096 131072 2097152
net.ipv4.tcp_wmem = 4096 16384 2097152
# Unsent data stays small, so a peer that stops reading cannot fill the buffers.
net.ipv4.tcp_notsent_lowat = 131072
# Pressure starts at 3 GiB, above the 2.5 GiB of the unit limits, so DoT, DoH and
# the hub link do not feel the proxy's buffers.
net.ipv4.tcp_mem = 786432 1048576 1572864
# A kernel built with MPTCP would otherwise offer it on a listener of ours; the
# units say multipathtcp=0 as well. The dash: a kernel without MPTCP has no such key.
-net.mptcp.enabled = 0

# Provisional (D31) until the load test T-374 measures a value; 524,288 holds the
# tracked entries of 5.5 with room for the identified Unbound and the host, about
# 160 MB of kernel memory when full. The leading dash makes systemd-sysctl skip the
# line when the module is not loaded yet instead of failing the file;
# modules-load.d/ctrlz.conf loads it at boot.
-net.netfilter.nf_conntrack_max = 524288
# An entry outlives its connection by at most 30 s. The same dash applies.
-net.netfilter.nf_conntrack_tcp_timeout_syn_sent = 10
-net.netfilter.nf_conntrack_tcp_timeout_last_ack = 10
-net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 30
-net.netfilter.nf_conntrack_tcp_timeout_close_wait = 30
-net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
-net.netfilter.nf_conntrack_tcp_timeout_unacknowledged = 30
-net.netfilter.nf_conntrack_tcp_timeout_max_retrans = 30

# No core of a node process is kept (SC 5.2a). The pipe is systemd-coredump's, which
# the agent accepts and whose drop-in says Storage=none; where that binary is not
# installed the kernel keeps no core at all. Without this line a stock Ubuntu Server
# has apport's pipe, which the agent refuses, and neither Unbound would start. 60 sorts
# after apport's own 50-apport.conf, so this one wins at boot.
kernel.core_pattern = |/usr/lib/systemd/systemd-coredump %P %u %g %s %t %c %h
