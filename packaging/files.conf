# Files the install copies from the verified bundle (SRC is under packaging/).
# SRC DEST MODE, all owned by root. Read by install/apply.sh and by
# internal/pkgcheck, which also fails when a file of packaging/ is neither here
# nor one of the install's own inputs, so a new unit cannot be forgotten.
systemd/ctrlz-dns.service /etc/systemd/system/ctrlz-dns.service 0644
systemd/ctrlz-agent.service /etc/systemd/system/ctrlz-agent.service 0644
systemd/ctrlz-proxy.service /etc/systemd/system/ctrlz-proxy.service 0644
systemd/ctrlz-unbound.service /etc/systemd/system/ctrlz-unbound.service 0644
systemd/ctrlz-unbound-free.service /etc/systemd/system/ctrlz-unbound-free.service 0644
polkit/50-ctrlz-agent.rules /etc/polkit-1/rules.d/50-ctrlz-agent.rules 0644
sysctl/60-ctrlz.conf /etc/sysctl.d/60-ctrlz.conf 0644
modules-load/ctrlz.conf /etc/modules-load.d/ctrlz.conf 0644
coredump/ctrlz.conf /etc/systemd/coredump.conf.d/ctrlz.conf 0644
chrony/chrony.conf /etc/chrony/chrony.conf 0644
apparmor/local-usr.sbin.unbound /etc/apparmor.d/local/usr.sbin.unbound 0644
apparmor/local-usr.sbin.chronyd /etc/apparmor.d/local/usr.sbin.chronyd 0644
