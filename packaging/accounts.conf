# Accounts of a node (p4-nodes 7.1, R16). One line each, read by install/apply.sh
# with `read` and by the install-layout test of internal/pkgcheck, so the script
# and the test cannot disagree about who is in which group.
#
#   group  NAME
#   user   NAME PRIMARY_GROUP HOME
#   member USER GROUP            (a supplementary group, written to /etc/group)
#
# Group ctrlz holds only ctrlz-dns and ctrlz-agent: it owns /run/ctrlz and the
# group-readable parts of /var/lib/ctrlz. ctrlz-proxy and the two Unbound users
# have groups of their own. A system user has no shell and no password.
group ctrlz
group ctrlz-agent
group ctrlz-dns
group ctrlz-proxy
group ctrlz-unbound
group ctrlz-unbound-free
# Read access to /etc/ctrlz/unbound, where the agent writes both configs (mode 0640)
# and the Unbound processes read them, again at every reload_keep_cache. The
# membership is in /etc/group and not in the unit, because Unbound calls
# initgroups() for its own user when it starts and would drop a group the unit gave.
group ctrlz-unbound-cfg

user ctrlz-agent ctrlz-agent /var/lib/ctrlz
user ctrlz-dns ctrlz-dns /nonexistent
user ctrlz-proxy ctrlz-proxy /nonexistent
user ctrlz-unbound ctrlz-unbound /var/lib/ctrlz-unbound
user ctrlz-unbound-free ctrlz-unbound-free /var/lib/ctrlz-unbound-free

member ctrlz-dns ctrlz
member ctrlz-agent ctrlz
# The agent talks to each Unbound's control socket, which Unbound creates 0770 in
# the group of its own user.
member ctrlz-agent ctrlz-unbound
member ctrlz-agent ctrlz-unbound-free
member ctrlz-unbound ctrlz-unbound-cfg
member ctrlz-unbound-free ctrlz-unbound-cfg
