# Fixed by the Ctrl Z install (p4-nodes 7.1, 7.10). It names no time source: the
# panel is the node's only source, over NTS, and the agent writes that to
# /etc/ctrlz/chrony/ctrlz.sources, which `sourcedir` below reads. A node with no
# panel keeps its clock until the panel is back.
#
# chronyd parses its configuration as root, and the agent can write the directory
# named by `sourcedir`. A sourcedir file accepts source lines only (server, pool,
# peer), so a compromised agent cannot hand chronyd `user`, `include`, `logdir`,
# `mailonchange` or any other directive (R16). Everything that is not a source
# line is therefore fixed here and never in the agent's file.
user _chrony
driftfile /var/lib/chrony/chrony.drift
ntsdumpdir /var/lib/chrony
rtcsync
leapsectz right/UTC
# The only CA that NTS-KE trusts is the node CA, which the agent copies next to its
# source file. Without nosystemcert, ntstrustedcerts only adds to the system CAs and
# any public CA would do.
nosystemcert
ntstrustedcerts /etc/ctrlz/chrony/node_ca.pem
minsources 1
makestep 1.0 3
# No `allow` and no `port`: the node does not serve time.
sourcedir /etc/ctrlz/chrony
