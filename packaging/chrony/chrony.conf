# Fixed by the Ctrl Z install (p4-nodes 7.1, 7.10). It names no time source: the
# panel is the node's only source, over NTS, and the agent writes that to
# /etc/ctrlz/chrony/ctrlz.conf, which `confdir` below reads. A node with no
# panel keeps its clock until the panel is back.
driftfile /var/lib/chrony/chrony.drift
ntsdumpdir /var/lib/chrony
rtcsync
leapsectz right/UTC
# No `allow` and no `port`: the node does not serve time.
confdir /etc/ctrlz/chrony
