# The run directories of P4b (p4b-proxy 3.3), made at boot and by the install. Each is
# the place of one socket of 2.1, with the group that may reach it; what a peer may
# then send is judged by SO_PEERCRED, not by these modes.
#
# Type Path                Mode User         Group          Age
# dns serves proxy.sock here; the proxy connects through the group.
d /run/ctrlz-link          0750 ctrlz-dns    ctrlz-link     -
# block serves serve.sock and agent.sock. The directory is setgid with group ctrlz-link,
# so serve.sock is born in that group and block needs no membership of it: with one, a
# compromised block could open proxy.sock. agent.sock goes to ctrlz-blockkey, of which
# block is a member. Members of either group must traverse the directory, so others
# have x (2711); the sockets (0660) are what keeps others out.
d /run/ctrlz-block         2711 ctrlz-block  ctrlz-link     -
# xrayctl serves ctl.sock for the agent. The directory is setgid, so ctl.sock is born
# in group ctrlz-xrayctl and ctrlz-xray (both Xray slots run as it) needs no membership
# of it: a slot would otherwise carry a group meant for the agent alone.
d /run/ctrlz-xrayctl       2750 ctrlz-xray   ctrlz-xrayctl  -
# One api.sock for each slot. Only uid ctrlz-xray reaches it.
d /run/ctrlz-xray-a        0700 ctrlz-xray   ctrlz-xray     -
d /run/ctrlz-xray-b        0700 ctrlz-xray   ctrlz-xray     -
